
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Port hote parametrable (docker compose lit DB_PORT depuis .env).
      # Doit correspondre au port de DATABASE_URL.
      - "${DB_PORT:-5432}:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
