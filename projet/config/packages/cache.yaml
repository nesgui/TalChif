framework:
    cache:
        # Le cache applicatif utilise l'adaptateur systeme de fichiers par defaut.
        #
        # Redis a ete retire du deploiement : l'image PHP n'embarque pas ext-redis
        # et aucun client (predis) n'est installe, le conteneur n'etait donc pas
        # joignable. Les pools Doctrine configures en prod (doctrine.yaml) sont
        # derives du code et identiques dans chaque conteneur : un cache local
        # suffit.
        #
        # Pour un cache partage entre les conteneurs php, messenger_worker et cron :
        #   1. ajouter ext-redis au Dockerfile (ou composer require predis/predis)
        #   2. decommenter les deux lignes ci-dessous
        #   3. remettre le service redis dans docker-compose.prod.yml
        #
        #app: cache.adapter.redis
        #default_redis_provider: '%env(REDIS_URL)%'
