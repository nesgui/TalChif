# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Point d'entree de la configuration des services applicatifs.
# Les dependances tierces se configurent dans packages/.
#
# Les handlers, services et repositories sont tous resolus par autowiring :
# seuls les arguments non deductibles (scalaires, parametres, variables
# d'environnement) sont declares explicitement ci-dessous.
parameters:

services:
    _defaults:
        autowire: true      # Injection automatique des dependances.
        autoconfigure: true # Enregistrement automatique (commandes, subscribers, voters...).

    # Un service par classe de src/, identifie par son nom pleinement qualifie.
    App\:
        resource: '../src/'
        # Ni les entites Doctrine ni les objets du domaine ne sont des services.
        exclude:
            - '../src/Entity/'
            - '../src/Domain/'
            - '../src/Application/Command/'
            - '../src/Application/Query/'
            - '../src/Message/'
            - '../src/Kernel.php'

    # Upload de fichiers : repertoire racine du projet.
    App\Service\Upload\ServiceUploadFichier:
        arguments:
            $repertoireProjet: '%kernel.project_dir%'

    # CORS : liste blanche d'origines, vide par defaut.
    App\EventSubscriber\CorsSubscriber:
        arguments:
            $corsAllowOrigin: '%env(APP_CORS_ALLOW_ORIGIN)%'

    # PawaPay : identifiants et correspondants par operateur.
    App\Service\Payment\PawaPayClient:
        arguments:
            $baseUrl: '%app.pawapay.base_url%'
            $apiToken: '%app.pawapay.api_token%'
            $currency: '%app.pawapay.currency%'
            $correspondents: '%app.pawapay.correspondents%'

    # Messages utilisateur : la session est l implementation par defaut.
    App\Service\Notification\MessagesUtilisateurInterface:
        alias: App\Service\Notification\MessagesFlash
